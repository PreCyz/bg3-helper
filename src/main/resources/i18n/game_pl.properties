Choose\ Duelling.\ Set\ Divine\ Smite\ to\ ask\ on\ a\ hit\ so\ you\ can\ decide\ when\ to\ spend\ a\ spell\ slot.=Wybierz styl Pojedynkowanie. W reakcjach ustaw pytanie o Boskie ugodzenie przy trafieniu, aby decydować o zużyciu komórki czaru.
