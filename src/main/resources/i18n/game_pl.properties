Choose\ The\ Fiend\ and\ learn\ Eldritch\ Blast.\ Finish\ weakened\ foes\ to\ gain\ temporary\ hit\ points\ from\ Dark\ One’s\ Blessing.=Wybierz patrona Czart i naucz się Nieziemskiego uderzenia. Dobijaj osłabionych wrogów, aby błogosławieństwo patrona zapewniało tymczasowe punkty wytrzymałości.
Choose\ Twinned\ Spell\ and\ Distant\ Spell.\ Use\ Twinned\ Spell\ on\ eligible\ single-target\ spells\ when\ a\ second\ target\ is\ worth\ the\ sorcery\ points.=Wybierz metamagie Bliźniaczy czar i Odległy czar. Użyj pierwszej na czarze z jednym celem, gdy objęcie drugiego celu jest warte punktów magii.
