Use\ Evasion\ and\ your\ movement\ to\ stay\ near\ the\ opponent\ you\ want\ to\ disrupt.\ Keep\ your\ bonus\ action\ available\ for\ Drunken\ Technique.=Dzięki Unikowi i dużej szybkości możesz pozostać przy najgroźniejszym przeciwniku. Zachowaj akcję dodatkową na Pijaną technikę.
Use\ Evasion\ to\ hold\ your\ position\ against\ Dexterity-save\ effects.\ Between\ encounters,\ use\ Harmony\ of\ Fire\ and\ Water\ if\ you\ need\ ki\ before\ the\ next\ rest.=Unik ułatwi utrzymanie pozycji pod ostrzałem. Między walkami użyj Harmonii ognia i wody, jeśli potrzebujesz ki przed odpoczynkiem.
Use\ Extra\ Attack\ against\ the\ same\ target.\ Try\ Stunning\ Strike\ early\ in\ the\ turn\ so\ the\ party\ can\ exploit\ a\ successful\ stun.=Zacznij od Ogłuszającego uderzenia, a następnie użyj Dodatkowego ataku. Ogłuszenie celu ułatwi zadanie całej drużynie.
Use\ Extra\ Attack\ for\ routine\ turns.\ Spend\ ki\ on\ Stunning\ Strike\ when\ stopping\ one\ foe\ matters\ more\ than\ hitting\ a\ group.=W zwykłej turze korzystaj z Dodatkowego ataku. Wydaj ki na Ogłuszające uderzenie, gdy zatrzymanie jednego wroga ma większe znaczenie niż trafienie grupy.
Use\ Extra\ Attack\ to\ follow\ up\ against\ an\ intoxicated\ enemy.\ Use\ Stunning\ Strike\ when\ an\ enemy\ resists\ your\ usual\ disruption.=Wykorzystaj Dodatkowy atak przeciw upitemu celowi. Gdy przeciwnik opiera się upojeniu, wypróbuj Ogłuszające uderzenie.
Use\ Extra\ Attack\ to\ land\ two\ weapon\ attacks\ with\ one\ action.\ Save\ a\ flourish\ for\ high-priority\ targets.=Dodatkowy Atak pozwala zaatakować bronią dwa razy w jednej akcji. Zachowaj popis na najważniejszy cel.
Use\ Hide\ in\ Plain\ Sight\ to\ set\ up\ a\ stationary\ ambush\ before\ combat.\ Choose\ another\ resistance\ or\ utility\ option\ from\ Natural\ Explorer.=Przed walką użyj Ukrycia na Widoku i przygotuj zasadzkę bez zmiany pozycji. Wybierz kolejną odporność lub zdolność użytkową Odkrywcy Przyrody.
Use\ Intimidating\ Presence\ when\ frightening\ one\ enemy\ is\ worth\ giving\ up\ an\ attack\ action.=Użyj Zastraszającej obecności, gdy przestraszenie jednego przeciwnika jest warte poświęcenia akcji ataku.
Use\ Magical\ Ambush\:\ hide\ first,\ then\ cast\ a\ spell\ with\ a\ saving\ throw.\ Prioritize\ a\ target\ whose\ turn\ you\ can\ prevent.=Wykorzystaj Magiczną zasadzkę. Ukryj się przed rzuceniem czaru z rzutem obronnym i wybierz wroga, którego chcesz pozbawić tury.
Use\ Magical\ Secrets\ for\ Counterspell\ and\ Command.\ Command\ gives\ you\ a\ control\ option\ while\ concentrating\ on\ another\ spell.=W ramach Magicznych Sekretów wybierz Kontrzaklęcie i Rozkaz. Rozkaz pozwala kontrolować wroga, gdy utrzymujesz koncentrację na innym zaklęciu.
Use\ Patient\ Defence\ when\ holding\ a\ narrow\ approach.\ Short\ rests\ restore\ the\ ki\ you\ will\ soon\ spend\ on\ disciplines.=Broniąc wąskiego przejścia, użyj Cierpliwej obrony. Krótki odpoczynek odnowi punkty ki potrzebne do dyscyplin.
Use\ Projected\ Ward\ to\ absorb\ damage\ for\ a\ nearby\ ally.\ Check\ whether\ you\ need\ to\ reserve\ your\ reaction\ for\ Counterspell\ instead.=Osłoń zagrożonego sojusznika projekcją osłony. Zanim zużyjesz reakcję, sprawdź, czy nie przyda się na Przeciwzaklęcie.
Use\ Reckless\ Attack\ in\ melee\ when\ you\ need\ advantage.\ For\ throws,\ seek\ high\ ground\ and\ a\ clear\ trajectory.=W zwarciu użyj Lekkomyślnego ataku, gdy potrzebujesz przewagi. Do rzutu szukaj wzniesienia i wolnego toru lotu.
Use\ Sacred\ Weapon\ before\ a\ difficult\ engagement\ to\ improve\ your\ chance\ to\ hit\ with\ your\ main\ weapon.=Przed trudną walką użyj Świętej broni, aby zwiększyć szansę trafienia bronią główną.
Use\ Scorching\ Ray\ to\ build\ Arcane\ Acuity\ with\ the\ Hat\ of\ Fire\ Acuity,\ then\ spend\ it\ on\ a\ difficult\ control\ spell.=Załóż Kapelusz ognistej przenikliwości i trafiaj Palącym Promieniem, aby gromadzić Mistyczną Przenikliwość. Następnie rzuć zaklęcie kontroli na trudnego przeciwnika.
Use\ Shadow\ Step\ between\ obscured\ positions\ for\ advantage\ on\ your\ next\ melee\ attack.\ Drow\ darkvision\ alone\ cannot\ see\ through\ magical\ Darkness.=Krok cienia przenosi cię między zacienionymi miejscami i daje przewagę przy następnym ataku w zwarciu. Sam wzrok drowa nie przenika magicznej Ciemności.
Use\ Sobering\ Realisation\ as\ a\ finisher.\ It\ deals\ psychic\ damage\ and\ ends\ the\ target’s\ Drunk\ condition,\ so\ time\ it\ after\ your\ follow-up\ attacks.=Użyj otrzeźwiającego ciosu na zakończenie serii. Zadaje obrażenia psychiczne, ale kończy stan upojenia celu.
Use\ Song\ of\ Rest\ between\ encounters\ to\ give\ the\ party\ an\ extra\ short\ rest.=Między walkami używaj Pieśni Odpoczynku, aby zapewnić drużynie dodatkowy krótki odpoczynek.
Use\ Step\ of\ the\ Wind\ to\ get\ out\ of\ reach\ after\ attacking.\ Save\ short\ rests\ for\ encounters\ where\ mobility\ costs\ ki.=Po ataku użyj Kroku wiatru, by wycofać się poza zasięg. Odnawiaj ki krótkim odpoczynkiem po walkach wymagających dużej mobilności.
Use\ Step\ of\ the\ Wind\ to\ reach\ cover\ or\ higher\ ground.\ Keep\ a\ little\ ki\ in\ reserve\ for\ defence.=Krok wiatru pozwoli ci dotrzeć za osłonę lub na wzniesienie. Zachowaj część ki na obronę.
