Additional\ listed\ damage\:\ 1d4\ necrotic.\ Elegant\ Duellist\:\ While\ your\ off-hand\ is\ empty,\ you\ score\ a\ Critical\ Hit\ when\ rolling\ a\ 19.\ Moreover,\ you\ gain\ an\ additional\ Reaction\ per\ turn.\ Withering\ Cut\:\ On\ a\ hit\ with\ a\ melee\ weapon,\ use\ a\ Reaction\ to\ deal\ additional\ Necrotic\ damage\ equal\ to\ your\ Proficiency\ Bonus.\ Challenge\ to\ Duel\:\ Challenge\ an\ enemy\ to\ attack\ only\ you,\ inflicting\ Bleeding\ on\ the\ target.\ Dueller's\ Enthusiasm\:\ While\ you\ are\ not\ dual-wielding\ and\ your\ off\ hand\ is\ empty,\ you\ can\ make\ an\ additional\ melee\ attack\ with\ The\ Dueller.\ (Recharge\:\ Per\ turn.)=Dodatkowe uszkodzenia wymienione: 1d4 necrotic. Elegancki Duellista: Podczas gdy Twój off- hand jest pusty, można zdobyć krytyczne trafienie podczas toczenia 19. Ponadto, można uzyskać dodatkową reakcję na skręt. Withering Cut: Na trafieniu z broni melee, Użyj Reaction do czynienia dodatkowych uszkodzeń necrotic równe swojej premii Proficiency. Wyzwanie do Duel: Wyzwanie wroga do ataku tylko ty, zadając Bleeding na cel. Dueller Enthusism: Podczas gdy nie jesteś dual- oweding i off ręka jest pusta, można dokonać dodatkowego ataku melee z Dueller. (Recharge: Per turn.)
