Additional\ listed\ damage\:\ 1d4\ necrotic.\ Heightened\ Necromancy\:\ Creatures\ have\ Disadvantage\ on\ Saving\ Throws\ against\ your\ necromancy\ spells.\ Life\ Essence\ Harvest\:\ When\ the\ wielder\ kills\ a\ hostile\ creature\ with\ a\ spell,\ they\ greedily\ absorb\ its\ energy\ and\ gain\ Life\ Essence\ until\ their\ next\ Long\ Rest.=Dodatkowe uszkodzenia wymienione w wykazie: 1d4 nekrotyczny. Zwiększona nekromancja: Stworzenia mają niekorzyść na Saving Throws przed swoich nekromantycznych zaklęć. Esencja życia Żniwa: Kiedy wieniec zabija wrogie stworzenie z zaklęciem, one chętnie absorbują jego energię i zyskują Esencję Życia aż do ich następnego długiego odpoczynku.
