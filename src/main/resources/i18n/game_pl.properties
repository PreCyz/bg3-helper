Choose\ Light\ Domain.\ Start\ with\ 16\ Wisdom\ and\ 16\ Constitution,\ prepare\ Bless\ and\ Healing\ Word,\ and\ use\ Warding\ Flare\ when\ an\ attack\ threatens\ you.=Wybierz Domenę Światła. Zacznij od 16 punktów Mądrości i 16 punktów Kondycji. Przygotuj Błogosławieństwo oraz Leczące Słowo i używaj Ochronnego Rozbłysku, gdy grozi ci trafienie.
Choose\ Oath\ of\ Devotion.\ Start\ with\ a\ one-handed\ weapon\ and\ shield;\ keep\ Lay\ on\ Hands\ for\ urgent\ healing.=Złóż Przysięgę Oddania. Zacznij z bronią jednoręczną i tarczą, a Nałożenie rąk zachowaj na pilne leczenie.
