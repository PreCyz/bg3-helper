Use\ Update\ preview\ to\ refresh\ the\ statistics.=Wybierz „Odśwież podgląd”, aby zaktualizować statystyki.
Use\ a\ party\ name\ between\ 1\ and\ 60\ characters.=Nazwa drużyny musi zawierać od 1 do 60 znaków.
Use\ a\ two-handed\ weapon\ and\ superiority\ dice\ to\ trip\ enemies,\ disarm\ them\ or\ turn\ a\ key\ swing\ into\ a\ hit.=Walcz bronią dwuręczną. Wydawaj kości przewagi, aby przewracać lub rozbrajać przeciwników i zwiększać szanse trafienia przy ważnym ataku.
Use\ build=Użyj konfiguracji
Use\ disciplines\ to\ pull\ or\ disable\ targets,\ then\ follow\ up\ in\ melee.\ Budget\ ki\ for\ the\ enemies\ that\ your\ ordinary\ attacks\ cannot\ control.=Przyciągaj lub obezwładniaj wrogów za pomocą dyscyplin, a następnie atakuj wręcz. Zachowaj punkty ki na przeciwników, których trudno powstrzymać zwykłym atakiem.
Use\ the\ Rogue’s\ extra\ feat\ for\ +2\ Dexterity,\ reaching\ 20.=Wykorzystaj dodatkowy atut łotrzyka na +2 do Zręczności, aby osiągnąć 20.
Use\ the\ extra\ movement\ to\ choose\ a\ shaded\ attack\ lane.\ If\ carrying\ the\ Resonance\ Stone,\ its\ psychic\ vulnerability\ aura\ can\ also\ affect\ your\ party.=Wykorzystaj ruch, aby atakować z cienia. Pamiętaj, że aura Kamienia rezonansu może zwiększyć także podatność sojuszników na obrażenia psychiczne.
Use\ the\ granted\ Scorching\ Ray\ attack\ to\ deal\ fire\ damage\ and\ build\ Arcane\ Acuity.=Użyj przyznanego ataku Scorching Ray, aby rozwiązać szkody pożarowe i zbudować Arcane ostrości.
Use\ the\ new\ Expertise\ choices\ on\ skills\ you\ regularly\ roll,\ such\ as\ Perception\ or\ Sleight\ of\ Hand.=Przeznacz nową ekspertyzę na często używane umiejętności, na przykład Percepcję lub Zwinne dłonie.
Use\ the\ radiant\ version\ of\ Destructive\ Wave\ against\ a\ crowd.\ It\ works\ alongside\ an\ active\ Spirit\ Guardians\ aura.=Użyj przeciw grupie Fali Zniszczenia w wariancie zadającym obrażenia od światłości. Możesz połączyć ją z aktywną aurą Duchowych Strażników.
Use\ weapon\ hits\ to\ build\ Arcane\ Acuity,\ then\ turn\ that\ accuracy\ into\ reliable\ control\ spells.=Trafiaj bronią, aby gromadzić poziomy Mistycznej Przenikliwości. Dzięki nim przeciwnikom trudniej oprzeć się twoim zaklęciom kontroli.
Use\ your\ extra\ Fighter\ feat\ for\ +2\ Strength,\ reaching\ 18.=Przeznacz dodatkowy atut wojownika na +2 do Siły, aby osiągnąć 18.
Use\ your\ extra\ movement\ to\ switch\ flanks\ after\ a\ flurry.\ Keep\ enough\ ki\ to\ counterattack\ on\ the\ enemy\ turn.=Po Gradzie ciosów przejdź na drugą flankę. Zostaw ki na kontratak podczas tury przeciwnika.
