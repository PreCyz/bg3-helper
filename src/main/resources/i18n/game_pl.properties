Choose\ Way\ of\ the\ Drunken\ Master.\ Drunken\ Technique\ makes\ it\ easier\ to\ disengage\ after\ striking.\ Cheeky\ Tipple\ can\ restore\ ki\ when\ you\ drink\ alcohol.=Wybierz Drogę Pijanego Mistrza. Pijana technika ułatwi odwrót po ataku, a zdolność picia alkoholu pozwoli odzyskać ki.
Choose\ Way\ of\ the\ Four\ Elements.\ Take\ Fangs\ of\ the\ Fire\ Snake\ for\ reach,\ Water\ Whip\ to\ reposition\ a\ foe,\ and\ Fist\ of\ Unbroken\ Air\ to\ push\ one\ away.=Wybierz Drogę Czterech Żywiołów. Kły ognistego węża wydłużą zasięg, Wodny bicz przyciągnie cel, a Pięść niewzruszonego powietrza go odepchnie.
Choose\ Way\ of\ the\ Open\ Hand.\ Try\ Flurry\ of\ Blows\:\ Topple\ before\ your\ allies\ make\ their\ melee\ attacks.=Wybierz Drogę Otwartej Dłoni. Użyj Gradu ciosów z powaleniem, zanim sojusznicy zaatakują cel w zwarciu.
Choose\ a\ Fiendish\ Resilience\ damage\ type\ to\ match\ the\ area.\ Eldritch\ Blast\ now\ fires\ three\ beams\ at\ character\ level\ 10.=Dobierz odporność od patrona do rodzaju obrażeń w okolicy. Na 10. poziomie postaci Nieziemskie uderzenie wystrzeliwuje trzy wiązki.
