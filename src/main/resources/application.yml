spring:
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  config:
    import: optional:file:./data/database.properties
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/bg3_forge?currentSchema=helper
    username: bg3_forge
  application:
    name: Faerun Forge
  web:
    error:
      include-message: never
  thymeleaf:
    cache: false
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      tracking-modes: cookie
forge:
  save-file: data/party.json
