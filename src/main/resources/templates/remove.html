<!doctype html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{shared::head(#{ui.confirm.removal})}"></head>
  <body>
    <header th:replace="~{shared::nav}"></header>
    <main class="wrap">
      <div class="crumb"><a href="parties">[[#{ui.parties}]]</a><i>›</i>[[#{ui.confirm.removal}]]</div>
      <section class="panel">
        <div class="panel-body">
          <h1 class="text-break" th:text="#{format.remove.confirm(${targetHero == null ? @words.partyName(targetParty,basePath) : targetHero.name})}"></h1>
          <p class="intro" th:if="${targetHero == null}"
             th:text="#{format.delete.party(${targetParty.heroes.size()})}"></p>
          <p class="intro" th:if="${targetHero != null}"
             th:text="#{format.delete.hero(${@words.partyName(targetParty,basePath)})}"></p>
        </div>
        <form method="post" class="card-actions">
          <input type="hidden" name="token" th:value="${removalToken}" />
          <a class="btn-quiet" href="parties">[[#{ui.cancel}]]</a>
          <button class="btn-quiet remove-link" th:text="${@words.text(targetHero == null ? 'Remove party' : 'Remove hero')}"></button>
        </form>
      </section>
    </main>
  </body>
</html>
