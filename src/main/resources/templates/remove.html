<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{shared::head('Confirm removal')}"></head>
  <body>
    <header th:replace="~{shared::nav}"></header>
    <main class="wrap">
      <div class="crumb"><a href="parties">Parties</a><i>›</i>Confirm removal</div>
      <section class="panel">
        <div class="panel-body">
          <h1 class="text-break" th:text="'Remove '+${targetHero == null ? targetParty.name : targetHero.name}+'?'"></h1>
          <p class="intro" th:if="${targetHero == null}"
             th:text="'This permanently deletes this party, its '+${targetParty.heroes.size()}+' heroes and its inventory.'"></p>
          <p class="intro" th:if="${targetHero != null}"
             th:text="'This permanently removes this hero from '+${targetParty.name}+'. Their equipment becomes available in the party inventory.'"></p>
        </div>
        <form method="post" class="card-actions">
          <input type="hidden" name="token" th:value="${removalToken}" />
          <a class="btn-quiet" href="parties">Cancel</a>
          <button class="btn-quiet remove-link" th:text="${targetHero == null ? 'Remove party' : 'Remove hero'}"></button>
        </form>
      </section>
    </main>
  </body>
</html>
