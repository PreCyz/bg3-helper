<!doctype html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{shared::head(#{ui.build.library})}"></head>
  <body>
    <header th:replace="~{shared::nav}"></header>
    <main class="wrap">
      <div class="crumb"><a href="parties" th:text="${@words.partyName(party,basePath)}"></a><i>›</i>[[#{ui.build.library}]]</div>
      <div class="page-top">
        <div>
          <h1>[[#{ui.build.library}]]</h1>
          <p>
            [[#{ui.start.with.a.community.build.then.adjust.its.abilities.and.equipm}]]
          </p>
        </div>
      </div>
      <div class="build-grid">
        <article class="panel build-card" th:each="b : ${builds}">
          <img th:src="${b.art}" alt="" />
          <div class="panel-body">
            <span class="section-label" th:text="${@words.text(b.role)}"></span>
            <h2 th:text="${@words.text(b.name)}"></h2>
            <small
              th:text="#{format.build.level(${@words.text(b.subclass)},${b.level},${@words.text(b.heroClass)})}"
            ></small>
            <p th:text="${@words.text(b.summary)}"></p>
            <details class="fold">
              <summary>[[#{ui.starting.setup}]]</summary>
              <p th:text="${@words.text(b.race)}+' · '+${@words.text(b.subclass)}"></p>
              <p><span th:each="score,i : ${b.abilities}"
                       th:text="${@words.text(shortNames[i.index])}+' '+${score}+${i.last ? '' : ' · '}"></span></p>
              <p th:text="#{format.skills(${@words.list(b.skills)})}"></p>
              <p th:if="${b.style != 'None'}" th:text="#{format.style(${@words.text(b.style)})}"></p>
            </details>
            <h3>[[#{ui.equipment.goals}]]</h3>
            <ul class="clean-list">
              <li th:each="id : ${b.items}" th:if="${catalog.get(id) != null}">
                <a
                  th:href="@{inventory(tab='catalog',q=${catalog.get(id).name})}"
                  th:text="${@words.text(catalog.get(id).name)}"
                ></a>
              </li>
            </ul>
            <details class="fold">
              <summary>[[#{ui.development.path}]]</summary>
              <ol class="track-levels">
                <li th:each="line,i : ${b.milestones}"><strong th:text="#{format.level(${i.count})}"></strong>
                  <span th:text="${@words.text(line)}"></span></li>
              </ol>
              <p th:text="${@words.text(b.note)}"></p>
              <a
                th:href="${b.guide}"
                th:text="${@words.text(b.guideName)}"
                target="_blank"
                rel="noreferrer"
              ></a>
            </details>
          </div>
          <div class="card-actions">
            <a
              th:href="'https://bg3.wiki/wiki/'+${b.wiki}"
              target="_blank"
              rel="noreferrer"
              >[[#{ui.wiki.subclass}]]</a
            ><a class="btn-gold" th:href="@{heroes/new(build=${b.id})}"
              >[[#{ui.use.build}]]</a
            >
          </div>
        </article>
      </div>
    </main>
    <footer th:replace="~{shared::footer}"></footer>
  </body>
</html>
